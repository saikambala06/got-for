<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>SKVK Assistant</title>
<link rel="stylesheet" href="theme.css" />
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <span class="mark">SK</span>
      <span class="name">SK<span> VK</span></span>
    </div>

    <!-- Signed out -->
    <div id="login-view" class="view" style="display:none;">
      <p class="hint">Log in with your SKVK account to parse resumes, score jobs against them, and tailor in one click.</p>
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@example.com" autocomplete="username" />
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
      <button id="loginBtn" class="primary">Log in</button>
      <div id="loginError" class="error"></div>
    </div>

    <!-- Signed in -->
    <div id="app-view" class="view" style="display:none;">
      <div class="userRow">
        <div class="avatar" id="avatar">?</div>
        <div class="userMeta">
          <div class="userName" id="userName">—</div>
          <div class="userEmail" id="userEmail">—</div>
        </div>
      </div>

      <div class="actions">
        <button id="parseBtn" class="primary" style="--i:0">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="7 10 12 5 17 10" /><line x1="12" y1="5" x2="12" y2="16" />
          </svg>
          Parse a resume
        </button>
        <p class="hint small" style="--i:1;margin:8px 0 0">Upload a PDF or DOCX and every field is extracted for you to review and save.</p>

        <div class="divider" style="--i:2">On this page</div>

        <button id="showPanelBtn" class="soft" style="--i:3">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <rect x="3" y="3" width="18" height="18" rx="2" /><line x1="15" y1="3" x2="15" y2="21" />
          </svg>
          Show panel on this page
        </button>
        <p class="hint small" style="--i:4;margin:8px 0 0">Works on LinkedIn, Indeed, Greenhouse, Lever, Jobright or any careers site.</p>

        <div class="divider" style="--i:5">Account</div>

        <button id="dashboardBtn" class="ghost" style="--i:6">Open SKVK dashboard</button>
        <button id="logoutBtn" class="ghost" style="--i:7">Log out</button>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
